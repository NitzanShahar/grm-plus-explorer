<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GRM+ Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>/* GRM+ Explorer — single-screen fullscreen layout.
   Header + sliders fixed at top; matrix fills remaining viewport. */

:root {
  --bg:          oklch(0.985 0.008 85);
  --bg-sunk:     oklch(0.965 0.010 85);
  --ink:         oklch(0.22 0.015 85);
  --ink-2:       oklch(0.38 0.012 85);
  --ink-3:       oklch(0.55 0.010 85);
  --rule:        oklch(0.90 0.010 85);
  --rule-2:      oklch(0.80 0.012 85);
  --hair:        oklch(0.93 0.010 85);

  --accent:      oklch(0.52 0.09 200);
  --accent-ink:  oklch(0.32 0.09 200);
  --accent-tint: oklch(0.93 0.035 200);

  --rev:         oklch(0.58 0.13 35);
  --rev-tint:    oklch(0.95 0.03 35);

  --edit-tint:   oklch(0.95 0.04 85);

  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --sans: "Instrument Sans", system-ui, sans-serif;
  --serif:"Instrument Serif", Georgia, serif;

  --r-s: 5px;
  --r-m: 8px;
}

* { box-sizing: border-box; }
html, body, #root { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
em { font-style: italic; }

.app {
  height: 100vh;
  display: grid;
  grid-template-rows: auto auto 1fr;
  max-width: 100%;
}

/* ===== SETUP SCREEN ===== */
.setup {
  height: 100vh;
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 24px;
}
.setup-inner { width: 100%; max-width: 980px; }
.setup-head { text-align: center; margin-bottom: 36px; }
.brand-mark.big { font-size: 54px; }
.setup-title {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 4px 0 16px;
  font-weight: 400;
}
.setup-lede {
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.5;
  color: var(--ink-2);
  max-width: 56ch;
  margin: 0 auto;
  text-wrap: pretty;
}
.setup-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.scard {
  text-align: left;
  padding: 18px 20px;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: var(--r-m);
  cursor: pointer;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color .12s, background .12s, transform .08s;
  font: inherit; color: inherit;
}
.scard:hover { border-color: var(--ink-2); background: var(--bg-sunk); }
.scard:active { transform: translateY(1px); }
.scard.custom { cursor: default; grid-column: span 2; }
.scard.custom:hover { background: var(--bg); border-color: var(--rule); }
.scard.custom.on { border-color: var(--ink-2); background: var(--bg-sunk); }
.scard-head-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.scard-head-row input { accent-color: var(--accent); }
.scard-name { font-family: var(--serif); font-size: 19px; color: var(--ink); line-height: 1.15; }
.scard-src  { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.02em; }
.scard-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-2); display: flex; gap: 6px; margin-top: 2px; }
.scard-cta  { font-family: var(--mono); font-size: 11px; color: var(--accent-ink); margin-top: 6px; letter-spacing: 0.04em; }
.scard-cta.big {
  align-self: flex-start;
  margin-top: 10px;
  padding: 8px 14px;
  border: 1px solid var(--accent);
  border-radius: var(--r-s);
  background: var(--accent-tint);
  color: var(--accent-ink);
  font-size: 12px;
  cursor: pointer;
}
.scard-cta.big:hover { background: var(--accent); color: white; }
.custom-fields { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--rule); }

/* ===== TOP BAR ===== */
.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 10px 24px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
}
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px 6px 8px;
  border: 1px solid var(--rule);
  border-radius: var(--r-s);
  color: var(--ink-2);
  font-size: 12px;
  background: var(--bg);
}
.back-btn:hover { border-color: var(--ink); color: var(--ink); background: var(--bg-sunk); }
.back-arrow { font-size: 14px; line-height: 1; }
.back-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; }
.tb-title { font-family: var(--serif); font-size: 20px; font-style: italic; color: var(--ink); line-height: 1.15; margin-top: 1px; }
.brand { display: flex; align-items: baseline; gap: 8px; padding-left: 20px; border-left: 1px solid var(--rule); margin-left: auto; }
.brand-mark {
  font-family: var(--serif);
  font-size: 26px;
  font-style: italic;
  color: var(--ink);
  line-height: 1;
}
.brand-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.scale-picker { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.tb-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.tb-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tb-select {
  font: inherit;
  font-family: var(--serif);
  font-size: 20px;
  color: var(--ink);
  background: var(--bg);
  border: none;
  border-bottom: 1px solid var(--rule-2);
  padding: 2px 22px 2px 0;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  min-width: 280px;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--ink-2) 50%),
    linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: right 8px top 14px, right 3px top 14px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.tb-select:focus { outline: none; border-bottom-color: var(--ink); }
.tb-source {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
}

.custom-controls {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  padding: 4px 10px;
  background: var(--bg-sunk);
  border: 1px solid var(--rule);
  border-radius: var(--r-s);
}
.mini-num {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
}
.mini-num input {
  width: 46px;
  height: 24px;
  padding: 0 4px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 12px;
  text-align: center;
  color: var(--ink);
  background: var(--bg);
  -moz-appearance: textfield;
}
.mini-num input::-webkit-outer-spin-button,
.mini-num input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.regen-btn {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
  padding: 4px 10px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--bg);
  display: inline-flex; gap: 4px; align-items: center;
}
.regen-btn:hover { border-color: var(--ink); color: var(--ink); }
.regen-ico { font-size: 13px; }

/* ===== SLIDER BAR ===== */
.sliderbar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto;
  gap: 0;
  padding: 12px 24px 10px;
  background: var(--bg-sunk);
  border-bottom: 1px solid var(--rule);
}
.pslider { padding: 0 20px; }
.pslider + .pslider, .sliderbar > .sliderbar-toggles { border-left: 1px solid var(--rule); }
.sliderbar > .sliderbar-toggles { padding: 0 0 0 20px; display: flex; align-items: flex-start; }

.pslider-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.ps-label { display: flex; align-items: baseline; gap: 8px; }
.ps-sym {
  font-family: var(--serif);
  font-size: 24px;
  font-style: italic;
  color: var(--ink);
  line-height: 1;
}
.ps-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.ps-ctrl { display: inline-flex; align-items: center; gap: 6px; }
.ps-input {
  width: 64px;
  height: 26px;
  padding: 0 6px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 13px;
  text-align: center;
  color: var(--ink);
  background: var(--bg);
  font-feature-settings: "tnum";
  outline: none;
}
.ps-input:focus { border-color: var(--ink); }
.ps-reset {
  width: 26px; height: 26px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--bg);
  color: var(--ink-3);
  font-size: 14px;
  line-height: 1;
}
.ps-reset:hover { border-color: var(--ink); color: var(--ink); }

.pslider-track-wrap { position: relative; padding: 2px 0 18px; }
.pslider-range {
  -webkit-appearance: none; appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 99px;
  background: linear-gradient(
    to right,
    var(--accent) 0%, var(--accent) var(--pct, 50%),
    var(--rule) var(--pct, 50%), var(--rule) 100%
  );
  outline: none;
}
.pslider-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--ink);
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--ink);
  cursor: grab;
}
.pslider-range::-moz-range-thumb {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--ink);
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--ink);
}
.pslider-ticks { position: absolute; inset: auto 0 0 0; top: 12px; height: 14px; pointer-events: none; }
.ptick {
  position: absolute;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center;
}
.ptick i { width: 1px; height: 3px; background: var(--rule-2); display: block; }
.ptick em {
  font-family: var(--mono); font-size: 9px;
  color: var(--ink-3); font-style: normal; margin-top: 1px;
}
.pslider-hint { font-size: 10.5px; color: var(--ink-3); line-height: 1.35; max-width: 36ch; margin-top: 2px; }

.chip-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-2);
  cursor: pointer;
  padding: 6px 10px;
  border-radius: var(--r-s);
}
.chip-toggle:hover { background: var(--bg); }
.chip-toggle input { accent-color: var(--accent); }

/* ===== MATRIX ===== */
.matrix-view {
  display: grid;
  grid-template-rows: 1fr auto;
  min-height: 0;
  overflow: hidden;
}
.matrix-scroll {
  overflow: auto;
  min-height: 0;
  padding: 0 24px;
}
.matrix {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12.5px;
}
.matrix thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg);
  text-align: left;
  font-weight: 400;
  padding: 10px 10px;
  border-bottom: 1px solid var(--rule);
  color: var(--ink-2);
  vertical-align: bottom;
}
.col-item   { width: 30%; }
.col-params { width: 22%; min-width: 240px; }
.col-cat    { text-align: center !important; padding: 8px 4px !important; min-width: 64px; }
.col-exp    { width: 72px; text-align: center !important; padding: 8px 10px !important; background: var(--bg-sunk); }
.cat-num    { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 2px; }
.cat-lab    { font-size: 11px; line-height: 1.25; color: var(--ink-2); font-variant: small-caps; letter-spacing: 0.02em; }

.item-row td {
  padding: 3px 10px;
  border-bottom: 1px solid var(--hair);
  vertical-align: middle;
}
.item-row:hover { background: color-mix(in oklch, var(--accent-tint) 25%, transparent); }
.item-row.is-reversed { background: color-mix(in oklch, var(--rev-tint) 40%, transparent); }
.item-row.is-reversed:hover { background: color-mix(in oklch, var(--rev-tint) 65%, transparent); }
.item-row.is-edited td.col-params { background: var(--edit-tint); }

.item-cell { display: flex; align-items: flex-start; gap: 10px; }
.item-idx { font-family: var(--mono); font-size: 10px; color: var(--ink-3); padding-top: 1px; width: 18px; flex-shrink: 0; }
.item-text { color: var(--ink); line-height: 1.3; text-wrap: pretty; font-size: 12px; }
.rev-badge {
  display: inline-flex; align-items: center; gap: 3px;
  margin-left: 6px; padding: 1px 5px;
  font-family: var(--mono); font-size: 10px;
  color: var(--rev);
  background: var(--rev-tint);
  border: 1px solid color-mix(in oklch, var(--rev) 40%, transparent);
  border-radius: 99px;
  letter-spacing: 0.04em;
  vertical-align: middle;
}
.rev-badge.small { padding: 1px 5px; margin: 0; }

.params { display: flex; flex-wrap: wrap; gap: 3px 4px; align-items: center; }
.param {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--mono); font-size: 10.5px;
  padding: 0 3px;
  background: var(--bg-sunk);
  border: 1px solid var(--hair);
  border-radius: 3px;
  color: var(--ink-2);
}
.item-row.is-reversed .param { background: color-mix(in oklch, var(--bg) 70%, var(--rev-tint)); }
.param .pk { color: var(--ink-3); }
.pv-input {
  width: 40px; height: 16px;
  padding: 0 2px;
  margin: 0;
  font-family: var(--mono); font-size: 11px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink);
  text-align: center;
  font-feature-settings: "tnum";
  outline: none;
  border-radius: 2px;
}
.pv-input:hover { border-color: var(--rule); background: var(--bg); }
.pv-input:focus { border-color: var(--ink); background: var(--bg); }
.param-reset {
  margin-left: 4px;
  width: 20px; height: 20px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  color: var(--ink-3);
  font-size: 11px;
  background: var(--bg);
}
.param-reset:hover { border-color: var(--ink); color: var(--ink); }

/* ----- probability cells ----- */
.cell {
  position: relative;
  text-align: center;
  vertical-align: bottom !important;
  padding: 3px 4px !important;
  border-left: 1px solid var(--hair);
}
.cell-bar-wrap {
  position: relative;
  height: 24px;
  width: 28px;
  margin: 0 auto 2px;
  background: var(--bg-sunk);
  border: 1px solid var(--hair);
  border-radius: 2px;
  overflow: hidden;
}
.cell-bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: color-mix(in oklch, var(--accent) 55%, var(--bg));
  transition: height .15s ease;
}
.cell-bar-base {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    45deg, transparent, transparent 3px,
    color-mix(in oklch, var(--ink) 30%, transparent) 3px,
    color-mix(in oklch, var(--ink) 30%, transparent) 4px
  );
  transition: height .15s ease;
}
.cell-pct {
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-2); font-feature-settings: "tnum";
}
.pct-sign { color: var(--ink-3); margin-left: 1px; font-size: 9px; }

.cell.is-most .cell-bar { background: var(--accent); }
.cell.is-most .cell-pct { color: var(--accent-ink); font-weight: 600; }
.cell.is-most .cell-bar-wrap { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.item-row.is-reversed .cell-bar { background: color-mix(in oklch, var(--rev) 55%, var(--bg)); }
.item-row.is-reversed .cell.is-most .cell-bar { background: var(--rev); }
.item-row.is-reversed .cell.is-most .cell-pct { color: var(--rev); }
.item-row.is-reversed .cell.is-most .cell-bar-wrap { border-color: var(--rev); box-shadow: 0 0 0 1px var(--rev); }

.col-exp { background: var(--bg-sunk); }
.exp-num { font-family: var(--mono); font-size: 13px; color: var(--ink); font-feature-settings: "tnum"; }
.exp-of  { display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 1px; }

/* ----- footer total ----- */
tfoot td {
  padding: 10px 10px;
  border-top: 1px solid var(--rule);
  background: var(--bg-sunk);
  font-size: 12px;
}
.tfoot-label {
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase;
}
.tfoot-bar { padding: 10px 16px !important; }
.tfoot-exp { text-align: center; }
.total-bar {
  height: 10px;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 99px;
  overflow: hidden;
}
.total-fill {
  height: 100%;
  background: var(--accent);
  transition: width .18s ease;
}

/* ----- legend ----- */
.legend {
  display: flex; flex-wrap: wrap;
  gap: 18px;
  padding: 10px 24px;
  border-top: 1px solid var(--rule);
  background: var(--bg);
  font-size: 11px;
  color: var(--ink-3);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-sw { display: inline-block; width: 18px; height: 8px; border-radius: 2px; }
.sw-most { background: var(--accent); }
.sw-bar  { background: color-mix(in oklch, var(--accent) 55%, var(--bg)); }
.sw-base {
  background: repeating-linear-gradient(
    45deg, transparent, transparent 2px,
    color-mix(in oklch, var(--ink) 30%, transparent) 2px,
    color-mix(in oklch, var(--ink) 30%, transparent) 3px
  );
}
.legend-hint { margin-left: auto; font-style: italic; }
</style>
</head>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script>// IRT item-parameter banks for preset questionnaires.
// Each item: { text, a, b[] }  with Nlikert implied by b.length + 1.
// reversed: index list of reversed items (none for these three clinical scales).

// --- R-GPTS Reference (5-point Likert, 0..4) — Freeman et al. 2021, Table 4 ---
const RGPTS_REF = {
  id: 'rgpts_ref',
  name: 'R-GPTS — Ideas of Reference',
  source: 'Freeman et al. (2021), Psychological Medicine',
  nLikert: 5,
  labels: ['Not at all', 'Somewhat', 'Moderately', 'Very', 'Totally'],
  reversed: [],
  items: [
    { text: 'I spent time thinking about friends gossiping about me.',            a: 2.65, b: [-0.10, 0.44, 1.17, 1.69] },
    { text: 'I often heard people referring to me.',                               a: 2.55, b: [-0.12, 0.53, 1.13, 1.74] },
    { text: 'I have been upset by friends and colleagues judging me critically.',  a: 2.40, b: [-0.17, 0.48, 1.09, 1.67] },
    { text: 'People definitely laughed at me behind my back.',                     a: 3.69, b: [ 0.17, 0.62, 0.97, 1.38] },
    { text: 'I have been thinking a lot about people avoiding me.',                a: 2.47, b: [ 0.10, 0.66, 1.26, 1.84] },
    { text: 'People have been dropping hints for me.',                             a: 2.80, b: [ 0.31, 0.83, 1.31, 1.84] },
    { text: 'I believed that certain people were not what they seemed.',           a: 2.10, b: [-0.51, 0.10, 0.73, 1.32] },
    { text: 'People talking about me behind my back upset me.',                    a: 3.37, b: [-0.07, 0.36, 0.80, 1.22] },

  <script>// GRM+ model — port of generate_irt from GRM+_sigma_acq.R

function plogis(x) { return 1 / (1 + Math.exp(-x)); }
function softmax(xs) {
  const mx = Math.max(...xs);
  const ez = xs.map(v => Math.exp(v - mx));
  const s  = ez.reduce((a, b) => a + b, 0);
  return ez.map(v => v / s);
}

function grmPlus(a, b, isReversed, psi, sigma, zeta, Nlikert) {
  const cum = new Array(Nlikert + 1);
  cum[0]       = 1.0;
  cum[Nlikert] = 0.0;
  for (let k = 1; k < Nlikert; k++) {
    cum[k] = plogis(a * (psi - b[k - 1]) / sigma);
  }
  let p = new Array(Nlikert);
  for (let k = 0; k < Nlikert; k++) p[k] = cum[k] - cum[k + 1];
  for (let k = 0; k < Nlikert; k++) if (p[k] < 0 || !isFinite(p[k])) p[k] = 0;
  let s = p.reduce((a, b) => a + b, 0);
  if (!(s > 0) || !isFinite(s)) {
    p = new Array(Nlikert).fill(1 / Nlikert);
  } else {
    p = p.map(v => v / s);
  }
  if (isReversed) p = p.slice().reverse();
  const base = p.slice();

  const kMid = (Nlikert + 1) / 2;
  const xk = [];
  for (let k = 1; k <= Nlikert; k++) xk.push(2 * (k - kMid) / (Nlikert - 1));

  const noiseFloor = 1e-6;
  const V = p.map(v => Math.log(v + noiseFloor));
  const vK = V.map((v, i) => v + xk[i] * zeta);
  const plus = softmax(vK);

  return { base, plus, xk };
}

function expectedScore(probs) {
  return probs.reduce((s, p, k) => s + p * k, 0);
}
function argmax(xs) {
  let best = 0;
  for (let i = 1; i < xs.length; i++) if (xs[i] > xs[best]) best = i;
  return best;
}

// Generate item params with distributions matching R-GPTS
// (a ~ 2.5–4.0, b thresholds spanning roughly 0 to 2, ordered).
function generateItemParams(nItems, nLikert) {
  const randn = () => {
    const u = Math.max(1e-9, Math.random()), v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  const items = [];
  for (let i = 0; i < nItems; i++) {
    // discrimination: like R-GPTS — mean ~3.0, sd ~0.7, clamped to [2.1, 4.5]
    let a = 3.0 + 0.7 * randn();
    a = Math.max(2.1, Math.min(4.5, a));
    a = +a.toFixed(2);

    // thresholds: ordered draws spanning ~0.0 to ~2.0
    // each item has its own difficulty center (-0.1 to 0.9) and moderate spread
    const center = -0.1 + Math.random() * 1.0;
    const spread = 0.55 + Math.random() * 0.25;
    const raw = [];
    for (let k = 0; k < nLikert - 1; k++) {
      // uniform-ish draws, then sort
      raw.push((k - (nLikert - 2) / 2) * spread + 0.15 * randn());
    }
    raw.sort((x, y) => x - y);
    const b = raw.map(v => +((center + v)).toFixed(2));

    items.push({ text: `Item ${i + 1}`, a, b });
  }
  return items;
}

window.grmPlus = grmPlus;
window.expectedScore = expectedScore;
window.argmax = argmax;
window.generateItemParams = generateItemParams;
</script>

  <script type="text/babel">// Matrix — main visualization. Single scrollable pane.

function MatrixView({ config, psi, sigma, zeta, showBase }) {
  const { items, nLikert, labels, reversed } = config;
  const reversedSet = React.useMemo(() => new Set(reversed), [reversed]);

  // local override of item params so user can tweak them
  const [overrides, setOverrides] = React.useState({});
  React.useEffect(() => setOverrides({}), [config.id, config.name, items.length]);

  const getItem = (i) => overrides[i] ? { ...items[i], ...overrides[i] } : items[i];

  const rows = items.map((_, i) => {
    const it = getItem(i);
    const isRev = reversedSet.has(i);
    const r = window.grmPlus(it.a, it.b, isRev, psi, sigma, zeta, nLikert);
    return { ...it, idx: i + 1, i, isRev, ...r };
  });

  const totalExpected = rows.reduce((s, r) => s + window.expectedScore(r.plus), 0);
  const totalMax = items.length * (nLikert - 1);

  const setItemParam = (i, key, value) => {
    setOverrides(prev => {
      const cur = prev[i] || {};
      return { ...prev, [i]: { ...cur, [key]: value } };
    });
  };
  const resetItemParams = (i) => {
    setOverrides(prev => { const n = { ...prev }; delete n[i]; return n; });
  };

  return (
    <div className="matrix-view">
      <div className="matrix-scroll">
        <table className="matrix">
          <thead>
            <tr>
              <th className="col-item">Item</th>
              <th className="col-params">Parameters</th>

                <th key={k} className="col-cat">
                  <div className="cat-num">{k}</div>
                  <div className="cat-lab">{lab}</div>
                </th>
              ))}
              <th className="col-exp">E[y]</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (

              <td colSpan={nLikert} className="tfoot-bar">

      labels: window.defaultLikertLabels(nLikert),
      items,
      reversed,

  }, []);

    if (customOn && !customCfg) genCustom(customSettings);

      id: p.id, name: p.name, source: p.source,
      nLikert: p.nLikert, labels: p.labels,
      items: p.items.map((it, i) => ({ ...it, idx: i + 1 })),
      reversed: p.reversed || [],
    });
  };

  const updateCustom = (s) => {
    setCustomSettings(s);
    genCustom(s);
  };

  return (
    <div className="setup">
      <div className="setup-inner">
        <div className="setup-head">
          <div className="brand-mark big">GRM+</div>
          <h1 className="setup-title">Explorer</h1>
          <p className="setup-lede">
            Visualize how a responder's latent trait (ψ), response noise (σ) and
            acquiescence bias (ζ) reshape response probabilities under the GRM+
            item-response model. Pick a validated scale, or configure a custom one.
          </p>
        </div>

        <div className="setup-cards">
          {window.PRESET_LIST.map(p => (
            <button key={p.id} className="scard" onClick={() => pickPreset(p.id)}>
              <div className="scard-name">{p.name}</div>
              <div className="scard-src">{p.source}</div>
              <div className="scard-meta">
                <span>{p.items.length} items</span>
                <span>·</span>
                <span>{p.nLikert}-pt Likert</span>
                {(p.reversed || []).length > 0 && <><span>·</span><span>{p.reversed.length} reversed</span></>}
              </div>
              <div className="scard-cta">Open →</div>
            </button>
          ))}

          <div className={'scard custom' + (customOn ? ' on' : '')}>
            <label className="scard-head-row">
              <input
                type="checkbox"
                checked={customOn}
                onChange={e => setCustomOn(e.target.checked)}
              />
              <span className="scard-name">Custom scale</span>
            </label>
            <div className="scard-src">Sampled priors — a ∼ N(3.0, 0.7); thresholds ordered around item-specific centers.</div>

            {customOn && customCfg && (
              <>
                <div className="custom-fields">
                  <MiniNumField label="items"    min={2} max={30} value={customSettings.nItems}
                    onChange={v => updateCustom({ ...customSettings, nItems: v, nReversed: Math.min(customSettings.nReversed, v) })} />
                  <MiniNumField label="K"        min={2} max={7}  value={customSettings.nLikert}
                    onChange={v => updateCustom({ ...customSettings, nLikert: v })} />
                  <MiniNumField label="reversed" min={0} max={customSettings.nItems} value={customSettings.nReversed}
                    onChange={v => updateCustom({ ...customSettings, nReversed: v })} />
                  <button className="regen-btn" onClick={() => genCustom(customSettings)} title="Regenerate parameters">
                    <span className="regen-ico">↻</span> regenerate
                  </button>
                </div>
                <button className="scard-cta big" onClick={() => onContinue(customCfg)}>
                  Continue with custom →
                </button>
              </>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function MiniNumField({ label, min, max, value, onChange }) {
  return (
    <label className="mini-num">
      <span>{label}</span>
      <input type="number" min={min} max={max} value={value}
        onChange={e => { const v = Number(e.target.value); if (!isNaN(v)) onChange(Math.max(min, Math.min(max, v))); }} />
    </label>
  );
}

Object.assign(window, { Setup });
</script>
  <script type="text/babel">// Two-screen app: Setup → Matrix.

const DEFAULTS = { psi: 0, sigma: 1, zeta: 0 };

function App() {
  const [config, setConfig] = React.useState(null);

  // person parameters (live)
  const [psi,   setPsi]   = React.useState(DEFAULTS.psi);
  const [sigma, setSigma] = React.useState(DEFAULTS.sigma);
  const [zeta,  setZeta]  = React.useState(DEFAULTS.zeta);
  const [showBase, setShowBase] = React.useState(false);

  if (!config) {
    return <Setup onContinue={(cfg) => {
      setPsi(DEFAULTS.psi); setSigma(DEFAULTS.sigma); setZeta(DEFAULTS.zeta);
      setConfig(cfg);
    }} />;
  }

  return (
    <div className="app">
      <TopBar
        config={config}
        onBack={() => setConfig(null)}
      />
      <SliderBar
        psi={psi}   setPsi={setPsi}
        sigma={sigma} setSigma={setSigma}
        zeta={zeta}  setZeta={setZeta}
        showBase={showBase} setShowBase={setShowBase}
      />
      <MatrixView
        config={config}
        psi={psi} sigma={sigma} zeta={zeta}
        showBase={showBase}
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
